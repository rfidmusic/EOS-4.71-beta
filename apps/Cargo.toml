[workspace]
resolver = "2"
members = ["eos-core", "eos-flasher", "eos-pantest"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
midir = "0.10"
cpal = "0.15"
rfd = "0.15"
sha2 = "0.10"
hound = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
